<script>
"use strict";

class Idol{
	//AudioContextとコンプレッサーはstatic&private領域に確保することにした
	static #audCtx = new AudioContext();
	static #audComp = Idol.#audCtx.createDynamicsCompressor();
	static{
		Idol.#audComp.connect( Idol.#audCtx.destination )
	}
	static resumeAudioContext(){ return Idol.#audCtx.resume() }

	#cid=-1; //chara_id
	#nam=""; //name
	#typ=""; //type
	#cv="";  //voice
	#iir=""; //image_icon_ref
	#be=false; //.isReady
	#aubTitS=null; //AudioBuffer:Titlecall:Solo
	#aubTitU=null; //AudioBuffer:Titlecall:Unit
	#aubNamD=null; //AudioBuffer:Name:withDesu
	#aubNamX=null; //AudioBuffer:Name:withoutDesu
	#urlIco="";   //URL of Icon(cache)

	constructor(charaId,name,type,voice,hrefIcon){
		this.#cid = parseInt(charaId);
		this.#nam = name;
		this.#typ = type;
		this.#cv = voice;
		this.#iir = hrefIcon;
	}
	get charaId(){ return this.#cid }
	get name(){ return this.#nam }
	get type(){ return this.#typ }
	get voice(){ return this.#cv }
	get isReady(){ return this.#be }
	get urlIcon(){ return this.#urlIco } //回答欄にアイコンを付けるといいかもと思って改変した

	async crawl(){
		if(this.#be){return this}

		//アイドル情報のvoiceが空文字列ではない＝タイトルコールがある「かもしれない」。
		//例えば2017年の「恋が咲く季節」イベントの時(だと思われる)、この曲を歌うアイドルのCV 5名分 が反映されたものの、
		//タイトルコール実装はカード報酬となった2名にとどまっている。
		//タイトルコールが存在するかは個人情報JSONに現れないので直接音声ファイルのURLを叩いてみる。
		const id2vo = c => `/va2/${ (this.#cid ^ 0x1042fc).toString(16) }10442${c}16ab.mp3`;
		//本家ソースちら見した限り、音声は画像と同じサーバにあるらしい。
		const hrefTitS = new URL( id2vo("c"), this.#iir ).href; //タイトルコール/ソロ用
		const hrefTitU = new URL( id2vo("d"), this.#iir ).href; //タイトルコール/ユニット用
		const hrefNamD = new URL( id2vo("2"), this.#iir ).href; //名前＋です
		const hrefNamX = new URL( id2vo("1"), this.#iir ).href; //名前(体言止め)

		// ++非同期関数++ URLから音声データにする
		const asyGetAudioData = async (href)=>{
			let aud;
			try{
				const abf = await cachey.requestOrFetch(href);
				aud = await Idol.#audCtx.decodeAudioData(abf);
			}catch(e){
				console.warn(e);
				aud = null;
			}
			return aud;
		};
		// ++非同期関数++ URLから画像データを指すオブジェクトURLを得る
		const asyGetBlobImage = async ()=>{
			let ou;
			try{
				const blb = await cachey.requestOrFetch(this.#iir);
				ou = URL.createObjectURL( blb )
			}catch(e){
				console.warn(e);
				ou = null;
			}
			return ou;
		};

		try{
			[
				this.#aubTitS, this.#aubTitU,
				this.#aubNamD, this.#aubNamX, this.#urlIco
			] = await Promise.all([
				asyGetAudioData(hrefTitS), asyGetAudioData(hrefTitU),
				asyGetAudioData(hrefNamD), asyGetAudioData(hrefNamX), asyGetBlobImage()
			])
			this.#be = true;
		}catch(e){
			console.warn(e);
			console.warn(`cause of [${this.#cid}] ${this.#nam} (cv. ${this.#cv})`);
		}
		return this;
	}
	//crawl()が成功裏に終われば this.isReady == true で喋れる
	async #play(buffer){
		if(!(buffer instanceof AudioBuffer)){ throw new TypeError("arg must be AudioBuffer") }
		let pfResolve;
		const prmReturn = new Promise((rslv,_)=>{pfResolve=rslv}); //resolve関数を当スコープに持ち出したPromise
		const sn = Idol.#audCtx.createBufferSource();
		sn.buffer = buffer;
		sn.connect( Idol.#audComp );
		sn.addEventListener("ended",()=>{pfResolve()})
		sn.start( Idol.#audCtx.currentTime );
		return prmReturn;
	}
	playTitleCall(isSolo){
		if(this.isReady){
			return this.#play(isSolo ? this.#aubTitS : this.#aubTitU)
		}else{
			return Promise.reject( new Error(`Idol ${this.name}=#${this.charaId} is not ready`) )
		}
	}
	playMyName(beWithDesu){
		if(this.isReady){
			return this.#play(beWithDesu ? this.#aubNamD : this.#aubNamX)
		}else{
			return Promise.reject( new Error(`Idol ${this.name}=#${this.charaId} is not ready`) )
		}
	}
}

function queryPutText(query, text){
	const e = document.querySelector(`${query}`);
	if(e){ e.textContent = `${text}` }
}

class TIdoldex{
	static #atype = ["cute","cool","passion"]; //属性の配列

	#aidol;
	constructor(){
		this.#aidol=[new Idol]; this.#aidol.pop(); //こうすることでVSCodeでヒントが出るようになる
	}
	get numberIdol(){ return this.#aidol.length }
	static get listType(){ return [...TIdoldex.#atype] }

	async initWithSLDB(){
		//SLDB API endpoints : https://starlight.kirara.ca/static/api.html
		const hrefTopPage = "https://starlight.kirara.ca/"
		const rurlListChar = "/api/v1/list/char_t?keys=chara_id";
		const rurlInfoChar = "/api/v1/char_t/";

		// ++非同期関数++ 問い合わせてレスポンスのJSONをオブジェクトに変換して返す。
		const asyncFetchAndStrip = async (sUrl)=>{
			const url = new URL(sUrl,hrefTopPage);
			const ans = (await fetch( url.href ).then(r=>r.json()))["result"];
			if(ans instanceof Array){
				return ans;
			}else{
				throw new Error(`${url.href} did not return valid result.`)
			}
		}

		const outputting = (txt)=>{queryPutText("#div-output",txt)}
		const loging = (txt)=>{queryPutText("#div-log",txt)}

		outputting(`⌛リソース取得開始${window.indexedDB ? "" : " !! NO-INDEXED-DATABASE"}`)

		let prmInitIDB = cachey.asyncInit(); //cacheyの初期化Promiseを先行させておく
		let ar1 = await asyncFetchAndStrip( rurlListChar );
		let sr1 = new Set( ar1.map(o=>o["chara_id"]) );

		loging(`(Idoldex.initWithSLDB) 全 ${sr1.size} 人`);

		let ar2 = await asyncFetchAndStrip( rurlInfoChar + Array.from(sr1).join() )
		ar2 = ar2.filter( o=>o["voice"] );
		await prmInitIDB; //cacheyの初期化完了もここで待つ

		loging(`(Idoldex.initWithSLDB) voice名前あり ${ar2.length} 人`);

		let numGood = 0, numBad = 0;
		//jsonをIdolに変換＆crawl()＆個別の後処理済み配列
		let psri = await Promise.allSettled(ar2.map(o=>{
			const idol = new Idol(o["chara_id"], o["name"], o["type"], o["voice"],new URL(o["icon_image_ref"],hrefTopPage).href);
			return idol.crawl().then(anidol=>{
				if(anidol.isReady){numGood++}else{numBad++}
				outputting(`⌛リソース取得中... ${ 100 * (numGood+numBad) / ar2.length |0 }%`)
				loging(`loading (o${numGood} + x${numBad} = ${numGood+numBad})/${ar2.length}`)
				return anidol;
			});
		}));

		//大丈夫だった配列をprivate領域に引き取る、そしてデレステ上のデフォルト並び順に
		psri.map(r=>(r.status=="fulfilled"? r.value : null)).forEach(a=>{
			if(a && a.isReady){ this.#aidol.push(a) }
		});
		this.#aidol.sort( (fore,back)=>{
			let diffType = TIdoldex.#atype.indexOf(fore.type) - TIdoldex.#atype.indexOf(back.type);
			return diffType!==0 ? diffType : fore.charaId - back.charaId;
		} );
		outputting(`✅️リソース取得完了。タイトルコール実装済みアイドルは ${this.numberIdol} 人です。`)
		loging(`(Idoldex.initWithSLDB) 音声データあり ${numGood} 人`)
		return;
	}

	//charaId -> Idol / 見つからなければ undefined
	getIdolWithId(charaid){
		return this.#aidol.find( v=>(v.charaId==parseInt(charaid)) )
	}
	//全員
	getIdolsAll(){ return [...this.#aidol] }
	//タイプ別
	getIdolsOfType(strType){ return this.#aidol.filter( v=>(v.type==strType) ) }
};
const Idoldex = new TIdoldex;

//<template id="引数">のクローンを得る
function getCloneOfTemplateById(id){
	const tem = document.querySelector(`template#${id}`);
	if(tem instanceof HTMLTemplateElement){
		const cln = tem.content.cloneNode(true)
		if(cln instanceof DocumentFragment){
			return cln
		}else{
			throw new Error(`cloning made wrong with template#${id}.`)
		}
	}else{
		throw new Error(`template#${id} is not found.`)
	}
}

//リソース読み出し前処理
function setupScreenTop(){
	const clone = getCloneOfTemplateById("screen-top")

	//let h = clone.querySelector("h1");
	//document.title = h?.textContent ?? document.title;

	document.body.appendChild(clone);
}

//ページ読み込み時処理
window.addEventListener("load", ()=>{
	setupScreenTop();
	Idoldex.initWithSLDB().then(()=>{
		setupScreenTop2();
	})
});

//^^^^^^^^ ここまで準備 ^^^^^^^^
//vvvvvvvv ここから本題 vvvvvvvv

//クイズに使う値
let idsQuiz=[];
let countQuiz=0;
let countCorrect=0;
let countWrong=0;
let countStreak=0;
//TODO:オブジェクトでひとまとめに……する？

//アイドル選択は one-and-only Object
const objChoice = {
	needsChoice: 1, //必要選択数(出題ごとに変わりうる)
	choicedIdolIndices: [0],

	//[関数]解答欄準備
	ready: ()=>{
		objChoice.needsChoice = idsQuiz.length;
		objChoice.choicedIdolIndices.length = 0;
	},
	//[関数]イベント捕捉
	handleEvent: (ev)=>{
		if(ev.type === "change"){
			//choicedIdolIndicesの更新 (choicedIdolIndices <=neq=> charaId)
			if(ev.target.checked){
				objChoice.choicedIdolIndices.push( parseInt(ev.target.value,10) );
				//余分にcheckされたら古いものをuncheck
				while( objChoice.choicedIdolIndices.length > objChoice.needsChoice ){
					let x=objChoice.choicedIdolIndices.shift();
					let y=[...document.querySelectorAll("#idol-choice input")].find( elm=>(elm.value==x) );
					if(y instanceof HTMLInputElement){ y.checked = false }
				}
			}else{
				let i = objChoice.choicedIdolIndices.indexOf( parseInt(ev.target.value,10) );
				if( i >= 0 ){
					objChoice.choicedIdolIndices.splice(i,1); //i番目を抜き出す
				}
			}
			const spna = document.querySelector("#span-answer");
			if(spna){
				spna.textContent = cids2name(...objChoice.choicedIdolIndices); //選択情報更新
				const cid0 = objChoice.choicedIdolIndices[0];
				spna.className = cid0 ? `imascgss ${Idoldex.getIdolWithId(cid0)?.type ?? ""}` : "";
			}
		} //ev.type="change"
	},
};
//使い方。
//問題準備ができたら objChoice.ready() で値をリセット
//選ばれた数は objChoice.choicedIdolIndices.length
//正誤判定は objChoice.choicedIdolIndices と正解の配列の内容物をcompare

//ノード配置のクリア
function clearDivIO(){
	while(true){
		const e = document.body.lastElementChild;
		if( e instanceof HTMLScriptElement ){break;}
		e?.remove();
	}
}

//タイトル画面構成
function setupScreenTop2(){
	const b = document.querySelector("#gotoQuiz");
	if(b instanceof HTMLButtonElement){
		b.addEventListener("click", ()=>{
			//Chrome 66 以降、ページ読み込み時に生成されるAudioContextの初期が"suspend"に(＝いきなり音が鳴りださなくなる)
			//その対応として入力イベント処理中にaudctx.resume().then(action)。こっちの方が行儀がいい。
			//そのresume関数(非同期)を呼ぶ関数が準備してあるので呼んであげる
			Idol.resumeAudioContext().then( ()=>{setupQuizScreen()} )
		});
		b.disabled = false;
	}
	const p = document.querySelector("#gotoListen");
	if(p instanceof HTMLButtonElement){
		//試聴室へのボタン予定地
		//p.disabled = false;
	}
}

//クイズ画面構成
function setupQuizScreen(){
	//以降の画面で使われるHTMLElement群の初期化
	const clone = getCloneOfTemplateById("screen-quiz")

	//選択部の初期化処理
	let divic = clone.querySelector("#idol-choice")
	if(!divic){ throw new Error("#idol-choice is not found.") }
	divic.addEventListener("change",objChoice);

	const temicon = document.querySelector("template#icon-idol")
	if(!(temicon instanceof HTMLTemplateElement)){
		throw new Error("template#icon-idol is not found.")
	}
	for(const girl of Idoldex.getIdolsAll() ){
		const cln = temicon.content.cloneNode(true);
		if(!(cln instanceof DocumentFragment)){
			throw new Error("cloning made wrong")
		}
		let chk = cln.querySelector("input");
		if(chk){
			chk.value = girl.charaId;
		}
		let img = cln.querySelector("img");
		if(img){
			img.src = girl.urlIcon;
			img.alt = `${girl.name} (cv. ${girl.voice})`;
		}
		divic.appendChild(cln);
	}

	//再生ボタン。
	const btnp = clone.querySelector("#button-play");
	if(btnp instanceof HTMLButtonElement){
		btnp.addEventListener("click",playQuizSound)
	}
	//回答ボタン。
	const btna = clone.querySelector("#button-answer");
	if(btna instanceof HTMLButtonElement){
		btna.addEventListener("click",judgeAnswer)
	}

	clearDivIO();
	document.body.appendChild(clone);
	makeQuiz();
}

//出題(準備)する
function makeQuiz(){

	queryPutText("#out-countQuiz",   ++countQuiz)
	queryPutText("#out-countCorrect",countCorrect)
	queryPutText("#out-countWrong",  countWrong)
	queryPutText("#out-countStreak", countStreak<2 ? "" : `!! ${countStreak} COMBO` )

	let cntq = countStreak>=10 ? 2 : 1; //10問以上連続正解すると2人同時に(experimental)
	let lsid = Idoldex.getIdolsAll().map(girl=>girl.charaId);
	idsQuiz.length = 0;
	while(idsQuiz.length < cntq){
		idsQuiz.push( ...lsid.splice( parseInt(Math.random()*lsid.length), 1 ) )
	}

	//解答欄準備
	objChoice.ready();

	const idolChoiceInputs = [...document.querySelectorAll("#idol-choice input")];
	for( const c of idolChoiceInputs ){ c.checked = false; }

	const spnq = document.querySelector("#span-quiz");
	const spna = document.querySelector("#span-answer");
	const btnp = document.querySelector("#button-play");
	const btna = document.querySelector("#button-answer");

	if(spnq && spna && btnp){
		spnq.textContent = `答えは ${idsQuiz.length} 人`;
		if(idsQuiz.length>1){
			spnq.classList.add("strong");
			btnp.classList.add("strong");
		}else{
			spnq.classList.remove("strong");
			btnp.classList.remove("strong");
		}
		spna.textContent = "";
	}
	//ボタンを再生可能、回答不可能にする
	if(btnp instanceof HTMLButtonElement){ btnp.disabled = false }
	if(btna instanceof HTMLButtonElement){ btna.disabled = true }
}

//名前に変換
function cids2name(...ids){
	return ids.map( v=>Idoldex.getIdolWithId(v).name ).join("、");
}

//音声再生
function playQuizSound(){
	const tellers = idsQuiz.map( v=>Idoldex.getIdolWithId(v) ).filter( v=>(v instanceof Idol) )

	//ボタンを使用不能にする
	const btnp = document.querySelector("#button-play");
	if(btnp instanceof HTMLButtonElement){
		btnp.disabled = true;

		//まとめて・同時に再生。再生終了を待ってから回答可能に
		Promise.allSettled( tellers.map(v=>v.playTitleCall(tellers.length==1)) ).then( ()=>{
			const btna = document.querySelector("#button-answer");
			if(btna instanceof HTMLButtonElement){ btna.disabled = false }
		});
	}
}

//正誤判定
function judgeAnswer(){
	const btna = document.querySelector("#button-answer");
	if(btna instanceof HTMLButtonElement){ btna.disabled = true }

	const bJudge = ((_x,_y)=>{
		if(_x.length !== _y.length){ return false }
		for( let oy of _y ){ if( _x.indexOf(oy) < 0 ){ return false; } }
		return true; //つまり、長さが同じで一方の全要素が他方にも含まれていれば真
	})(idsQuiz, objChoice.choicedIdolIndices);

	if(bJudge){
		++countCorrect;
		++countStreak;
	}else{
		++countWrong;
		countStreak = 0;
	}

	//本来は正誤表示を出し、待機して次の問題or前の画面へ
	console.log(
		countQuiz+(bJudge
			?"[O] "
			:`[X] ${cids2name(...objChoice.choicedIdolIndices)} ではなくて `
		)+cids2name(...idsQuiz)
	);

	//正解を音声で通知
	let tellers = idsQuiz.map( v=>Idoldex.getIdolWithId(v) ).filter( v=>(v instanceof Idol) )
	let pchain = Promise.resolve();
	while( tellers.length > 0 ){
		const t0 = tellers.shift();
		const bFin = tellers.length==0;
		pchain = pchain.then( ()=>t0?.playMyName(bFin) );
	}
	pchain.then( ()=>{makeQuiz()} );
}
